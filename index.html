<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand__kicker">Neon Grid</span>
        <h1>New Tab</h1>
      </div>
      <button class="theme-toggle" type="button" aria-label="Przełącz tryb jasny i ciemny">
        <span class="theme-toggle__label">Light Mode</span>
      </button>
    </header>

    <main class="dashboard">
      <section class="hero-panel">
        <p class="eyebrow">System Time</p>
        <div class="clock-block">
          <div class="clock" aria-live="polite">20:48</div>
          <div class="date">Czwartek, 18 marca 2026</div>
        </div>

        <form class="search-panel" action="https://www.google.com/search" method="get">
          <label class="sr-only" for="search-input">Szukaj w Google</label>
          <input id="search-input" name="q" type="search" placeholder="Search the grid..." autocomplete="off">
          <button type="submit">Search</button>
        </form>
      </section>

      <div class="bottom-panels">
        <aside class="weather-panel">
          <div class="section-heading">
            <p class="eyebrow">Forecast</p>
            <h2>Weather</h2>
          </div>
          <div class="weather-widget">
            <div class="weather-widget__temp">21°C</div>
            <div class="weather-widget__meta">
              <strong>Warsaw</strong>
              <span>Clear sky</span>
              <span>Humidity 38%</span>
              <span>Wind 11 km/h</span>
            </div>
          </div>
        </aside>

        <section class="links-panel">
          <div class="section-heading">
            <p class="eyebrow">Fast Access</p>
            <h2>Top Links</h2>
          </div>
          <div class="top-links">
            <a class="top-link" href="https://github.com">GitHub</a>
            <a class="top-link" href="https://mail.google.com">Gmail</a>
            <a class="top-link" href="https://www.youtube.com">YouTube</a>
            <a class="top-link" href="https://www.reddit.com">Reddit</a>
            <a class="top-link" href="https://calendar.google.com">Calendar</a>
            <a class="top-link" href="https://open.spotify.com">Spotify</a>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
